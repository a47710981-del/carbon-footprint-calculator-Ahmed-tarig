<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Footprint Calculator - Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="calc-page">
  <div class="container-fluid">

    <!-- Heading -->
    <h1 class="calc-title">Carbon Footprint Calculator</h1>

    <!-- Tabs -->
    <ul class="nav calc-nav" id="calcTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general" type="button" role="tab">General</button>
      </li>
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-travel" type="button" role="tab">Travel</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-food" type="button" role="tab">Food</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-electronic" type="button" role="tab">Electronic usage</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-shopping" type="button" role="tab">Shopping</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-result" type="button" role="tab">Result</button>
      </li>
      <li class="nav-item ms-auto"><a class="btn btn-sm btn-green" href="index.html">Home</a></li>
    </ul>

    <!-- Card -->
    <div class="row justify-content-center">
      <div class="col-11 col-md-8 col-lg-5">
        <div class="card calc-card">
          <div class="card-header" id="cardHeader">Fill the form below</div>

          <div class="card-body">
            <div class="tab-content">

              <!-- General -->
              <div class="tab-pane fade show active" id="tab-general" role="tabpanel">
                <div class="row mb-3 align-items-center">
                  <label for="name" class="col-6 col-form-label">Name</label>
                  <div class="col-6"><input type="text" id="name" class="form-control"></div>
                </div>
                <div class="row mb-3 align-items-center">
                  <label for="age" class="col-6 col-form-label">Age</label>
                  <div class="col-6"><input type="number" id="age" min="0" class="form-control"></div>
                </div>
                <div class="row mb-3 align-items-center">
                  <label for="country" class="col-6 col-form-label">Country</label>
                  <div class="col-6">
                    <select id="country" class="form-select text-center">
                      <option selected>Saudi Arabia</option>
                      <option>United Arab Emirates</option>
                      <option>Egypt</option>
                      <option>Other</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Travel -->
              <div class="tab-pane fade" id="tab-travel" role="tabpanel">
                <div class="row mb-3 align-items-center">
                  <label for="car" class="col-6 col-form-label">Weekly car travel (miles)</label>
                  <div class="col-6"><input type="number" id="car" min="0" value="0" class="form-control"></div>
                </div>
                <div class="row mb-3 align-items-center">
                  <label for="flights" class="col-6 col-form-label">Flights per year (round trips)</label>
                  <div class="col-6"><input type="number" id="flights" min="0" value="0" class="form-control"></div>
                </div>
              </div>

              <!-- Food -->
              <div class="tab-pane fade" id="tab-food" role="tabpanel">
                <div class="row mb-3 align-items-center">
                  <label for="diet" class="col-4 col-form-label">Diet type</label>
                  <div class="col-8">
                    <select id="diet" class="form-select">
                      <option value="2.5">Meat-heavy (daily red meat)</option>
                      <option value="2.0" selected>Average (regular meat)</option>
                      <option value="1.5">Low meat / pescatarian</option>
                      <option value="1.0">Vegetarian</option>
                      <option value="0.7">Vegan</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Electronic usage -->
              <div class="tab-pane fade" id="tab-electronic" role="tabpanel">
                <div class="row mb-3 align-items-center">
                  <label for="electricity" class="col-6 col-form-label">Monthly electricity (kWh)</label>
                  <div class="col-6"><input type="number" id="electricity" min="0" value="0" class="form-control"></div>
                </div>
                <div class="row mb-3 align-items-center">
                  <label for="gas" class="col-6 col-form-label">Monthly natural gas (therms)</label>
                  <div class="col-6"><input type="number" id="gas" min="0" step="0.1" value="0" class="form-control"></div>
                </div>
              </div>

              <!-- Shopping -->
              <div class="tab-pane fade" id="tab-shopping" role="tabpanel">
                <div class="row mb-3 align-items-center">
                  <label for="shopping" class="col-6 col-form-label">Monthly spending on goods (USD)</label>
                  <div class="col-6"><input type="number" id="shopping" min="0" value="0" class="form-control"></div>
                </div>
              </div>

              <!-- Result -->
              <div class="tab-pane fade text-center" id="tab-result" role="tabpanel">
                <p class="mb-1" id="greeting"></p>
                <div class="display-5 fw-bold text-success"><span id="totalValue">0</span></div>
                <div class="text-muted mb-2">tons CO₂ per year</div>
                <span id="rating" class="badge text-bg-success mb-3 text-wrap">Calculating…</span>
                <ul class="list-group text-start">
                  <li class="list-group-item d-flex justify-content-between"><span>Home energy</span><span id="homeVal">0 t</span></li>
                  <li class="list-group-item d-flex justify-content-between"><span>Transportation</span><span id="transVal">0 t</span></li>
                  <li class="list-group-item d-flex justify-content-between"><span>Flights</span><span id="flightVal">0 t</span></li>
                  <li class="list-group-item d-flex justify-content-between"><span>Diet</span><span id="dietVal">0 t</span></li>
                  <li class="list-group-item d-flex justify-content-between"><span>Shopping</span><span id="shopVal">0 t</span></li>
                </ul>
                <p class="small text-muted mt-2 mb-0">Estimates only.</p>
              </div>

            </div>
          </div>

          <div class="card-footer">
            <button type="button" id="prevBtn" class="btn btn-sm btn-green me-2">Prev</button>
            <button type="button" id="nextBtn" class="btn btn-sm btn-green">Next</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
